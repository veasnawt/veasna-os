ext {
    // 24 (Android 7.0, 2016), not Capacitor's default 23 — the FFmpeg engine backing native video
    // export (see FfmpegPlugin.kt) requires it; the manifest merger refuses a lower floor outright
    // rather than risk APIs the library assumes exist. An 8+ year old device is a reasonable line to
    // stop supporting for on-device video encoding specifically.
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}