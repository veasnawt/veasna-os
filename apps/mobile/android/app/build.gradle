// FfmpegPlugin.kt is this app module's own first Kotlin source file — the Kotlin Gradle plugin isn't
// applied to `app` by default the way it already is for Capacitor's own plugin modules (e.g.
// @capacitor/filesystem's build.gradle, which declares this exact same self-contained buildscript
// block). Without it, `.kt` files are silently never compiled at all — MainActivity.java's own
// `registerPlugin(FfmpegPlugin.class)` fails with "cannot find symbol" rather than any Kotlin-specific
// error, which is what surfaced this.
buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def uploadStore = System.getenv("VCUT_UPLOAD_KEYSTORE")
def hasUploadSigning = uploadStore && ["VCUT_UPLOAD_STORE_PASSWORD", "VCUT_UPLOAD_KEY_ALIAS", "VCUT_UPLOAD_KEY_PASSWORD"].every { System.getenv(it) }
// Inspect the resolved graph too: aggregate tasks such as `bundle` include release output.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.project == project && it.name in ['bundleRelease', 'packageRelease', 'assembleRelease'] }
    def isIdeSigning = project.hasProperty("android.injected.signing.store.file") || project.hasProperty("android.injected.signing.key.alias")
    if (buildsRelease && !hasUploadSigning && !isIdeSigning && !project.hasProperty("vcutUnsignedReview")) {
        throw new GradleException("Release signing is missing. Set the VCUT_UPLOAD_* environment variables. Use -PvcutUnsignedReview only for a non-uploadable review bundle.")
    }
}

android {
    namespace "com.veasnawt.vcut"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.veasnawt.vcut"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "0.2.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv("VCUT_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("VCUT_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("VCUT_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadSigning) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Retired ffmpeg-kit's own binaries were pulled from Maven Central in 2025 — this fork republishes
    // a 16KB-page-aligned build (required for Play Store apps targeting API 35+, which this app already
    // does) under the same `com.arthenica.ffmpegkit` package, so FfmpegPlugin.kt's imports work unchanged.
    implementation "com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.1.1"
    implementation "com.android.billingclient:billing:8.0.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
