appId: com.veasnawt.veasnaos
productName: Veasna OS
# "maximum" (electron-builder's own default) drives NSIS's LZMA compressor to request a large
# contiguous memory buffer for its dictionary — on a memory-constrained dev machine this can make
# makensis.exe fail outright with "Internal compiler error #12345: error creating mmap" rather than
# just running slower. "normal" still compresses, just with a smaller buffer.
compression: normal
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# studios/universe's and studios/bp's standalone Next.js servers (server.js + a pruned
# node_modules + .next/static + public/ each), plus studios/gamedev's static Vite build — all
# copied here by scripts/build-resources.mjs. universe/bp get utilityProcess.fork'd at runtime
# (src/server/spawnNextServer.ts); gamedev is served by a plain local static file server
# (src/server/serveStaticDir.ts). See src/main.ts's spawnPackagedServers.
extraResources:
  - from: resources/universe
    to: universe
    filter:
      - "**/*"
  - from: resources/bp
    to: bp
    filter:
      - "**/*"
  - from: resources/gamedev
    to: gamedev
    filter:
      - "**/*"
# Native addons (better-sqlite3) can't execute from inside a .asar archive — must be unpacked to a
# real path on disk.
asarUnpack:
  - "**/*.node"
# build/icon.png — copied from assets/images/icon.png (the "V" glyph only, no wordmark text, which
# turns to illegible mush at real icon sizes like 16x16/32x32). This is what electron-builder bakes
# into the packaged .exe's icon resource — the same icon Explorer/Start Menu search shows. A single
# PNG is enough for electron-builder to auto-generate the per-platform .ico/.icns it needs; no
# per-OS icon path required unless a hand-crafted one is added later.
#
# Where `electron-updater` (src/updater.ts) checks for new versions — GitHub Releases on this
# repo's own remote. Setting this alone publishes nothing; an actual release still has to be
# created and have `electron-builder --publish always`'s build artifacts (the installer +
# latest.yml) uploaded to it, a separate, explicit step with its own GH_TOKEN requirement.
publish:
  provider: github
  owner: veasnawt
  repo: veasna-os
  # electron-builder's own default (releaseType unset) is a draft — confirmed the hard way: the
  # very first --publish run created a real release with the installer + latest.yml correctly
  # uploaded, but it stayed invisible to both the public GitHub API and electron-updater's own
  # check (which also ignores drafts) until manually published from the GitHub UI. `release` means
  # every future `--publish always` run goes live immediately with no separate manual step. (A
  # first attempt at this used a `draft: false` field, which doesn't actually exist in
  # electron-builder's GitHub publish schema — caught immediately by its own config validation on
  # the very next build, before this ever shipped.)
  releaseType: release
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.utilities
linux:
  target: AppImage
  category: Utility
