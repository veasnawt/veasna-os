packages:
  - "packages/*"
  - "studios/*"
  - "apps/*"

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  # ffmpeg-static's postinstall is what actually downloads the ffmpeg binary for this platform —
  # without it the package installs as an empty shell and VCut's export step has nothing to run.
  ffmpeg-static: true
  # Same reasoning as ffmpeg-static above — puppeteer's postinstall downloads the actual Chromium
  # binary the Khmer-text export render harness (studios/vcut's khmerTextHarness.ts) launches;
  # without it the package installs as an empty shell with no browser to launch at all.
  puppeteer: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@veasnawt/vicons@0.1.0'

# @electron/rebuild's own dependency chain pulls in @electron/node-gyp via a git URL rather than a
# registry version, which pnpm's default supply-chain guard rejects as an "exotic" transitive
# dependency. Needed only for apps/desktop's native-module rebuild step (better-sqlite3 -> Electron
# ABI) — not a runtime app dependency.
blockExoticSubdeps: false
