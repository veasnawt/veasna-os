packages:
  - "packages/*"
  - "studios/*"
  - "apps/*"

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@veasnawt/vicons@0.1.0'

# @electron/rebuild's own dependency chain pulls in @electron/node-gyp via a git URL rather than a
# registry version, which pnpm's default supply-chain guard rejects as an "exotic" transitive
# dependency. Needed only for apps/desktop's native-module rebuild step (better-sqlite3 -> Electron
# ABI) — not a runtime app dependency.
blockExoticSubdeps: false
