name: vcut-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vcut-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # packages/vcut is a private submodule; set VCUT_SUBMODULE_TOKEN (a PAT with read access to
          # veasnawt/vcut) as a repo secret, otherwise the default token is used.
          token: ${{ secrets.VCUT_SUBMODULE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use a full-featured FFmpeg for the real-render tests
        # The `ffmpeg-static` Linux binary is built without libfreetype (no `drawtext` filter), which the
        # text-export tests need; Ubuntu's package has it. Every test that renders resolves the bundled
        # binary through `ffmpeg-static`, so swap the file in place rather than teach each test a new path.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          for bin in $(find node_modules/.pnpm -path '*ffmpeg-static/ffmpeg' -type f); do
            cp "$(which ffmpeg)" "$bin"
          done
          ffmpeg -hide_banner -filters | grep -c drawtext
      - name: Build workspace deps (vicons ships only as built dist)
        run: pnpm --filter @veasnawt/vicons build
      - name: Typecheck (vcut package)
        working-directory: packages/vcut
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit + FFmpeg integration tests
        working-directory: packages/vcut
        run: pnpm test
      - name: Lint (vcut studio)
        run: pnpm --filter vcut lint
      - name: Production build (vcut studio)
        run: pnpm --filter vcut build
