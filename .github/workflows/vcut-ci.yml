name: vcut-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vcut-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # packages/vcut is a private submodule; set VCUT_SUBMODULE_TOKEN (a PAT with read access to
          # veasnawt/vcut) as a repo secret, otherwise the default token is used.
          token: ${{ secrets.VCUT_SUBMODULE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (vcut package)
        working-directory: packages/vcut
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit + FFmpeg integration tests
        working-directory: packages/vcut
        run: pnpm test
      - name: Lint (vcut studio)
        run: pnpm --filter vcut lint
      - name: Production build (vcut studio)
        run: pnpm --filter vcut build
